<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>保守費用 月払い｜伴 TOMO Web</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap">
<style>
:root{--navy:#1F3A5F;--navy2:#2C4E7A;--gold:#E8A33D;--over:#C46A2B;--bg:#F3EFE8;--card:#FFFFFF;--line:#E2DACB;--ink:#1F2A36;--mute:#6B5E48;--soft:#F7F4EE;--danger:#B3261E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181F;--card:#1D232C;--line:#33404F;--ink:#E8E4DC;--mute:#B5AC9C;--soft:#232B36}}
:root[data-theme="dark"]{--bg:#14181F;--card:#1D232C;--line:#33404F;--ink:#E8E4DC;--mute:#B5AC9C;--soft:#232B36}
input,select,textarea,button{background:var(--card)!important;color:var(--ink)}
button.primary{background:var(--navy)!important;color:#fff}button.gold{background:var(--gold)!important;color:#1F2A36}
.seg{background:var(--soft)}.seg button[aria-pressed="true"]{background:var(--card)!important}
.doc,.doc *{color-scheme:light}
.card h2,details.card summary{color:var(--ink)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
header.top{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
header.top b{font-family:"Noto Serif JP",serif;font-size:20px}
header.top span{font-size:13px;color:#C9D3E0}
.wrap{max-width:1280px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){.wrap{grid-template-columns:minmax(0,440px) minmax(0,1fr);align-items:start}.previewcol{position:sticky;top:16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 12px;font-size:16px;color:var(--navy);display:flex;align-items:center;gap:8px}
details.card summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
details.card summary::after{content:"開く";font-size:12px;color:var(--mute);font-weight:400}
details.card[open] summary::after{content:"閉じる"}
details.card[open] summary{margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:76px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(232,163,61,.55);outline-offset:1px;border-color:var(--gold)}
.row{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.row3{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--navy);padding:10px 14px;min-height:44px;font-weight:500}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
button.gold{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
button.ghost{border-color:transparent;background:transparent;color:var(--mute);min-height:36px;padding:6px 8px}
button:disabled{opacity:.5;cursor:default}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin-bottom:10px;background:var(--soft)}
.item .head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
.item .amt{font-weight:700;color:var(--navy);font-size:14px}
.totals{display:grid;gap:4px;margin-top:8px;font-size:14px}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-size:17px;font-weight:700;color:var(--navy);border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0}
.toggle input{width:22px;height:22px;flex:none}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:#E9E3D8;padding:4px;border-radius:12px;margin-bottom:12px}
.seg button{border:none;background:transparent;min-height:40px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy);font-weight:700;box-shadow:0 1px 3px rgba(31,58,95,.15)}
.actions{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px}
.actions .full{grid-column:1/-1}
.stage{background:#D9D2C4;border-radius:14px;padding:12px;overflow:hidden}
.scaler{transform-origin:top left}
.msg{font-size:13px;color:var(--mute);min-height:20px;margin:0 0 8px}
.msg.err{color:var(--danger)}
.hist{display:grid;gap:6px}
.hist button{text-align:left;display:flex;justify-content:space-between;gap:8px;font-weight:400}
.hist small{color:var(--mute)}
.hint{font-size:12px;color:var(--mute);margin:6px 0 0;line-height:1.6}
/* ===== document (A4 794x1123) ===== */
.doc{width:794px;height:1123px;background:#fff;color:#222;padding:52px 56px;font-family:"Noto Sans JP","Hiragino Sans",sans-serif;font-size:11.5px;line-height:1.55;position:relative;overflow:hidden}
.doc .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.doc .title{font-family:"Noto Serif JP",serif;font-size:30px;font-weight:700;color:var(--navy);letter-spacing:.35em;border-bottom:3px solid var(--navy);padding-bottom:6px;display:inline-block}
.doc .meta{text-align:right;color:#444;font-size:11px}
.doc .client{margin-top:26px;font-size:18px;font-weight:700;border-bottom:1.5px solid #333;display:inline-block;padding-bottom:3px;min-width:260px}
.doc .greet{margin-top:10px;color:#444;font-size:11px;max-width:380px}
.doc .issuer{text-align:right;font-size:10.5px;color:#333;line-height:1.6}
.doc .issuer .brand{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:10px 0 6px}
.doc .issuer .brand b{font-size:15px;color:var(--navy)}
.doc .issuer .brand .k{font-family:"Noto Serif JP",serif;font-size:20px;color:var(--navy)}
.doc .subject{margin:20px 0 10px;font-weight:700;font-size:12.5px}
.doc .sum{display:flex;justify-content:space-between;align-items:center;background:#F1F4F8;border:1px solid #DCE3EC;border-left:5px solid var(--navy);border-radius:4px;padding:12px 18px;gap:16px}
.doc .sum .lbl{font-size:11px;color:#444;font-weight:700}
.doc .sum .big{font-size:24px;font-weight:700;color:var(--navy)}
.doc .sum .right{text-align:right}
.doc .sum .right .lbl{color:#B3261E}
.doc .sum .right .val{font-size:15px;font-weight:700}
.doc .stamp{width:70px;height:70px;border:1.5px dashed #999;display:flex;align-items:center;justify-content:center;font-size:10px;color:#888;text-align:center;line-height:1.3}
.doc .bar{margin-top:16px;background:var(--navy);color:#fff;font-weight:700;font-size:11.5px;padding:6px 10px;border-radius:3px 3px 0 0}
.doc .bar.gray{background:#5B6470}
.doc table{width:100%;border-collapse:collapse;font-size:11px}
.doc th{background:#E8EEF6;border:1px solid #C9D3E0;padding:5px 6px;font-weight:700}
.doc td{border:1px solid #D6DCE4;padding:6px 8px;vertical-align:middle}
.doc td.c{text-align:center;width:46px}
.doc td.r{text-align:right;width:92px;white-space:nowrap}
.doc td .nm{font-weight:700}
.doc td .ds{font-size:9.8px;color:#666}
.doc tr.sub td{background:#FAFAFA;font-weight:700;text-align:right}
.doc tr.disc td{background:#FFF3F2;color:#B3261E;font-weight:700;text-align:right}
.doc tr.grand td{background:#E8EEF6;color:var(--navy);font-weight:700;text-align:right;font-size:12px}
.doc tr.tax td{text-align:right;color:#555;font-size:10.5px}
.doc .boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.doc .box{border:1px solid #D6DCE4;border-radius:5px;padding:10px 12px;background:#FAFBFC;font-size:10.5px;line-height:1.7}
.doc .box h4{margin:0 0 6px;color:var(--navy);font-size:11px;border-bottom:1px dashed #C9D3E0;padding-bottom:4px}
.doc .box .pre{white-space:pre-wrap}
.offscreen{position:fixed;left:-10000px;top:0}

.hist button[aria-pressed]{min-height:56px}
.seg button[aria-pressed="true"]{background:var(--navy)!important;color:#fff!important;font-weight:700}
.msg{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto!important;background:#1F2A36;color:#fff!important;border-radius:12px;padding:12px 14px;z-index:40;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:14px!important}
.msg.err{background:#B3261E}
.planpick{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);padding:4px;border-radius:12px}
.planpick .opt{position:relative;margin:0;display:block}
.planpick input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.planpick span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:6px 8px;border-radius:10px;background:var(--card);color:var(--ink);font-size:15px;pointer-events:none}
.planpick input:checked+span{background:var(--navy);color:#fff;font-weight:700}
.planpick input:focus-visible+span{outline:3px solid rgba(232,163,61,.55)}
.msg:empty{display:none}
#imgs img{width:100%;height:auto;border-radius:6px;background:#fff}
[hidden]{display:none!important}
/*darkfix*/
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hist button,:root:not([data-theme="light"]) .card h2,:root:not([data-theme="light"]) .totals .grand,:root:not([data-theme="light"]) .item .amt{color:var(--ink)!important}:root:not([data-theme="light"]) button:not(.primary):not(.gold){color:var(--ink)}}
:root[data-theme="dark"] .hist button,:root[data-theme="dark"] .card h2,:root[data-theme="dark"] .totals .grand{color:var(--ink)!important}
</style>
</head>
<body>
<header class="top">
<svg width="48" height="32" viewBox="0 0 120 80" aria-hidden="true"><circle cx="44" cy="40" r="36" fill="#fff"/><circle cx="76" cy="40" r="36" fill="#E8A33D"/><path d="M60 7.75A36 36 0 0 1 60 72.25A36 36 0 0 1 60 7.75Z" fill="#F6C979"/></svg>
<div><b>保守費用 月払い</b><br><span>毎月の請求書と領収書を作成　<b style="font-family:inherit;font-size:12px;background:#E8A33D;color:#1F2A36;padding:1px 6px;border-radius:6px">v8</b></span></div>
</header>
<div class="wrap">
<div class="formcol">
<details class="card" id="issuerCard">
<summary>発行者情報（自分の情報）</summary>
<div class="row"><div><label for="iName">屋号</label><input id="iName" data-i="name"></div><div><label for="iRep">代表者名</label><input id="iRep" data-i="rep"></div></div>
<label for="iAddr">住所</label><input id="iAddr" data-i="addr" placeholder="〒000-0000 北海道札幌市…">
<div class="row"><div><label for="iTel">電話</label><input id="iTel" data-i="tel" inputmode="tel"></div><div><label for="iMail">メール</label><input id="iMail" data-i="mail" inputmode="email"></div></div>
<div class="row"><div><label for="iWeb">Web</label><input id="iWeb" data-i="web"></div><div><label for="iReg">適格請求書の登録番号</label><input id="iReg" data-i="reg" placeholder="未登録なら空欄"></div></div>
<label for="iBank">振込先（金融機関・口座番号・名義）</label><textarea id="iBank" data-i="bank" placeholder="金融機関：○○銀行 ○○支店&#10;口座：普通 0000000&#10;名義：ホンマ カズヤ"></textarea>
</details>

<div class="card">
<h2>契約（お客様）</h2>
<div class="row"><select id="cSel" aria-label="契約を選ぶ"></select><button type="button" id="cNew">＋ 新しい契約</button></div>
<div id="cEdit">
<div class="row"><div><label for="cName">お客様名</label><input id="cName" data-c="client"></div><div><label for="cHon">敬称</label><select id="cHon" data-c="hon"><option>様</option><option>御中</option></select></div></div>
<div class="row"><div><label for="cStart">保守の開始月</label><input type="month" id="cStart" data-c="start"></div><div><label for="cCode">お客様番号</label><input id="cCode" data-c="code" placeholder="01"></div></div>
<p class="hint" id="planNote" style="font-weight:700;color:var(--ink)"></p>
<label for="cDue">お支払期限</label><select id="cDue" data-c="due"><option value="end">対象月（年払いは初月）の末日</option><option value="prevEnd">対象月の前月末日（前払い）</option></select>
<label style="margin-top:14px">月額の内訳（税込）</label>
<div id="mItems"></div>
<button type="button" id="addM">＋ 内訳を追加</button>
<div class="totals" id="mTotals"></div>
<label for="nInv">請求書の備考</label><textarea id="nInv" data-c="noteInv"></textarea>
<label for="nRec">領収書の備考</label><textarea id="nRec" data-c="noteRec"></textarea>
<button type="button" class="ghost" id="cDel" style="margin-top:8px;color:var(--danger)">この契約を削除</button>
</div>
</div>

<div class="card">
<h2 id="pTitle">請求する期間</h2>
<div class="hist" id="periods"></div>
<button type="button" id="more" style="margin-top:8px;width:100%">さらに先の期間を表示</button>
</div>
</div>

<div class="previewcol">
<div class="card" id="pCard">
<h2 id="selLabel">期間を選んでください</h2>
<div class="row"><div><label for="dInv">請求書の発行日</label><input type="date" id="dInv" data-l="inv"></div><div><label for="dDue">お支払期限</label><input type="date" id="dDue" data-l="dueDate"></div></div>
<div class="row"><div><label for="dPaid">入金日（領収日）</label><input type="date" id="dPaid" data-l="paid"></div><div><label for="pay">お支払方法</label><select id="pay" data-l="pay"><option>銀行振込</option><option>現金</option><option>口座振替</option><option>その他</option></select></div></div>
<p class="hint">請求書PDFを保存すると「請求済」、入金日を入れると「入金済」になります。</p>
</div>
<div class="seg" role="group" aria-label="プレビューする書類" style="grid-template-columns:1fr 1fr">
<button type="button" data-doc="inv" aria-pressed="true">請求書</button>
<button type="button" data-doc="rec" aria-pressed="false">領収書</button>
</div>
<div class="actions">
<button type="button" class="primary" id="pdfOne">この書類をPDF保存</button>
<button type="button" class="gold" id="pdfAll">請求書＋領収書をまとめて保存</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<div class="stage" id="stage"><div class="scaler" id="scaler"></div></div>
</div>
</div>
<div class="offscreen" id="off" aria-hidden="true"></div>
<div id="imgModal" hidden style="position:fixed;inset:0;background:rgba(20,24,31,.85);z-index:50;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))"><div style="max-width:800px;margin:0 auto"><div style="display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:10px"><span style="font-size:14px">長押しで保存・共有できます</span><button type="button" id="imgClose">閉じる</button></div><div id="imgs" style="display:grid;gap:12px"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>(function(){
const $=s=>document.querySelector(s);
const yen=n=>"￥"+Math.round(n||0).toLocaleString("ja-JP");
const num=v=>{const n=parseFloat(String(v??"").replace(/[^\d.\-]/g,""));return isFinite(n)?n:0};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const jdate=s=>{if(!s)return"";const[y,m,d]=s.split("-");return`${+y}年${+m}月${+d}日`};
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const madd=(ym,n)=>{const[y,m]=ym.split("-").map(Number);const d=new Date(Date.UTC(y,m-1+n,1));return d.toISOString().slice(0,7)};
const lastDay=ym=>{const[y,m]=ym.split("-").map(Number);return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10)};
const ymL=ym=>{const[y,m]=ym.split("-");return`${+y}年${+m}月`};
const defaultIssuer=()=>({name:"伴 TOMO Web",rep:"本間 一也",addr:"",tel:"090-2697-9671",mail:"tomotomo.web@gmail.com",web:"tomo-web.github.io",reg:"",bank:""});
function newContract(){const codes=S.contracts.map(c=>num(c.code));const code=String((codes.length?Math.max(...codes):0)+1).padStart(2,"0");return{id:"c"+Date.now(),client:"",hon:"様",code,start:madd(today().slice(0,7),1),plan:"monthly",due:"end",
items:[{name:"Webサイト維持管理・表示トラブル対応",price:1500},{name:"テキスト・画像の軽微な修正代行（月1〜2回）",price:1000},{name:"Googleビジネスプロフィール更新代行・簡易相談",price:500}],
noteInv:"・お振込手数料は貴社にてご負担をお願いいたします。\n・内容にご不明点があればお気軽にご連絡ください。",noteRec:"・上記金額を確かに領収いたしました。",ledger:{},show:12}}
let S={issuer:defaultIssuer(),contracts:[],cid:null,period:null};let current="inv";
const C=()=>S.contracts.find(c=>c.id===S.cid);
const mt=c=>c.items.reduce((a,i)=>a+num(i.price),0);
function periodKeys(c){if(!c.start)return[];if(c.plan==="annual"){const n=Math.max(1,Math.ceil(c.show/12));return Array.from({length:n},(_,i)=>madd(c.start,12*i)+"Y")}return Array.from({length:c.show},(_,i)=>madd(c.start,i))}
function info(c,key){const annual=key.endsWith("Y");const from=key.slice(0,7);const to=annual?madd(from,11):from;const m=mt(c);
const label=annual?`${ymL(from)}〜${ymL(to)}分・年払い`:`${ymL(from)}分`;const dueDefault=c.due==="prevEnd"?lastDay(madd(from,-1)):lastDay(from);
return{key,annual,from,to,label,amount:annual?m*11:m,subject:`Webサイト保守サポート費（${label}）`,no:`${from.replace("-","")}${annual?"Y":""}-${c.code||"00"}`,dueDefault}}
function L(c,key){const i=info(c,key);c.ledger[key]=c.ledger[key]||{};const l=c.ledger[key];if(!l.inv)l.inv=today();if(!l.dueDate)l.dueDate=i.dueDefault;if(!l.pay)l.pay="銀行振込";return l}
const status=l=>l&&l.paid?["入金済","#2E7D4F"]:l&&l.issued?["請求済","#B26A00"]:["未請求","#8A8A8A"];
/* ===== document ===== */
function docHTML(kind){const c=C(),I=S.issuer;if(!c||!S.period)return`<div class="doc"><p style="font-size:16px;color:#888;margin-top:200px;text-align:center">左で契約と期間を選ぶと、ここに書類が表示されます。</p></div>`;
const p=info(c,S.period),l=L(c,S.period),m=mt(c);const total=p.amount,tax=Math.floor(total*10/110);
const isInv=kind==="inv";const no=(isInv?"INV-":"REC-")+p.no;
const rows=c.items.map(i=>p.annual?`<tr><td><div class="nm">${esc(i.name)}</div></td><td class="c">12</td><td class="c">か月</td><td class="r">${yen(num(i.price))}</td><td class="r">${yen(num(i.price)*12)}</td></tr>`:`<tr><td><div class="nm">${esc(i.name)}</div></td><td class="c">1</td><td class="c">月</td><td class="r">${yen(num(i.price))}</td><td class="r">${yen(num(i.price))}</td></tr>`).join("");
const extra=p.annual?`<tr class="sub"><td colspan="4">【月額 ${yen(m)} × 12か月分】</td><td class="r">${yen(m*12)}</td></tr><tr class="disc"><td colspan="4">【年払い割引（1か月分）】</td><td class="r">-${yen(m)}</td></tr>`:"";
const issuer=`<div class="issuer"><div class="brand"><svg width="42" height="28" viewBox="0 0 120 80"><circle cx="44" cy="40" r="36" fill="#1F3A5F"/><circle cx="76" cy="40" r="36" fill="#E8A33D"/><path d="M60 7.75A36 36 0 0 1 60 72.25A36 36 0 0 1 60 7.75Z" fill="#C46A2B"/></svg><b>${esc(I.name)}</b></div>${I.rep?`代表：${esc(I.rep)}<br>`:""}${I.addr?esc(I.addr)+"<br>":""}${[I.tel&&"TEL: "+esc(I.tel),I.mail&&"Mail: "+esc(I.mail)].filter(Boolean).join(" / ")}${I.web?"<br>Web: "+esc(I.web):""}${I.reg?"<br>登録番号："+esc(I.reg):""}</div>`;
const stamp=!isInv&&total>=50000?`<div class="stamp">収入印紙</div>`:"";
const title=(isInv?"ご請求書":"領収証").split("").join(" ");
const greet=isInv?"平素は格別のご高配を賜り、厚く御礼申し上げます。<br>下記の通りご請求申し上げます。期日までにお支払いをお願いいたします。":"下記金額を正に領収いたしました。";
const left=isInv?`<h4>【お振込先】</h4><div class="pre">${esc(I.bank)||"（振込先が未入力です）"}</div>`:`<h4>【受領情報】</h4><div class="pre">お支払方法：${esc(l.pay)}\n領収日：${jdate(l.paid)||"（入金日が未入力です）"}</div>`;
const period=p.annual?`対象期間：${ymL(p.from)}〜${ymL(p.to)}（12か月）`:`対象期間：${ymL(p.from)}（1か月）`;
return`<div class="doc"><div class="hd"><div><div class="title">${title}</div><div class="client">${esc(c.client)||"&nbsp;"} ${esc(c.hon)}</div><div class="greet">${greet}</div></div><div><div class="meta">発行日：${jdate(isInv?l.inv:(l.paid||today()))}<br>${isInv?"請求書番号":"領収書番号"}：${esc(no)}</div>${issuer}</div></div>
<div class="subject">${isInv?"件名":"但し書き"}：${esc(p.subject)}<br><span style="font-weight:400;color:#555;font-size:11px">${period}</span></div>
<div class="sum"><div><div class="lbl">【${isInv?"ご請求金額":"領収金額"}（税込）】</div><div class="big">${yen(total)} -</div></div>${stamp}<div class="right"><div class="lbl">【${isInv?"お支払期限":"領収日（入金日）"}】</div><div class="val">${jdate(isInv?l.dueDate:l.paid)||"―"}</div></div></div>
<div class="bar">■ ${isInv?"内訳":"明細内容"}（運用・保守サポート／${p.annual?"年払い":"月払い"}）</div><table><thead><tr><th>項目 / 内容</th><th>数量</th><th>単位</th><th>単価</th><th>金額(税込)</th></tr></thead><tbody>${rows}${extra}
<tr class="grand"><td colspan="4">【合計（税込）】</td><td class="r">${yen(total)}</td></tr><tr class="tax"><td colspan="4">うち消費税（10%対象 ${yen(total)}）</td><td class="r">${yen(tax)}</td></tr></tbody></table>
<div class="boxes"><div class="box">${left}</div><div class="box"><h4>【備考・特記事項】</h4><div class="pre">${esc(isInv?c.noteInv:c.noteRec)||"―"}</div></div></div></div>`}
function render(){$("#scaler").innerHTML=docHTML(current);fit()}
function fit(){const st=$("#stage"),sc=$("#scaler");const k=Math.min(1,(st.clientWidth-24)/794);sc.style.transform=`scale(${k})`;sc.style.width="794px";st.style.height=(1123*k+24)+"px"}
window.addEventListener("resize",fit);
/* ===== UI ===== */
function renderContracts(){const sel=$("#cSel");sel.innerHTML="";if(!S.contracts.length){const o=document.createElement("option");o.textContent="契約がありません";sel.appendChild(o);sel.disabled=true;$("#cEdit").hidden=true}else{sel.disabled=false;$("#cEdit").hidden=false;S.contracts.forEach(c=>{const o=document.createElement("option");o.value=c.id;o.textContent=`${c.code} ${c.client||"（お客様名未入力）"}`;o.selected=c.id===S.cid;sel.appendChild(o)})}
const c=C();document.querySelectorAll("[data-c]").forEach(el=>{el.value=c?(c[el.dataset.c]??""):""});document.querySelectorAll("input[name=plan]").forEach(r=>{r.checked=!!c&&c.plan===r.value});renderItems();renderPeriods();renderLedger()}
function renderItems(){const c=C(),h=$("#mItems");h.innerHTML="";if(!c){$("#mTotals").innerHTML="";return}
c.items.forEach((it,idx)=>{const d=document.createElement("div");d.className="item";d.innerHTML=`<div class="head"><span>内訳 ${idx+1}</span><button type="button" class="ghost" aria-label="この内訳を削除">削除</button></div><label for="mn${idx}">項目</label><input id="mn${idx}" value="${esc(it.name)}"><label for="mp${idx}">月額（円）</label><input id="mp${idx}" inputmode="numeric" value="${esc(it.price)}">`;
d.querySelector(`#mn${idx}`).oninput=e=>{it.name=e.target.value;changed()};d.querySelector(`#mp${idx}`).oninput=e=>{it.price=e.target.value;changed(true)};
d.querySelector("button").onclick=()=>{c.items.splice(idx,1);renderItems();changed(true)};h.appendChild(d)});renderTotals()}
function renderTotals(){const c=C();if(!c)return;const m=mt(c);$("#planNote").textContent=c.plan==="annual"?`年払い：1年ごとに ${yen(m*11)} を請求します（1か月分割引）`:`月払い：毎月 ${yen(m)} を請求します`;$("#mTotals").innerHTML=`<div class="${c.plan==="annual"?"":"grand"}"><span>月払い</span><span>${yen(m)} / 月</span></div><div class="${c.plan==="annual"?"grand":""}"><span>年払い（1か月分割引）</span><span>${yen(m*11)} / 年</span></div><div style="font-size:12px;color:var(--mute)"><span>年払いは月払いより</span><span>${yen(m)} お得</span></div>`}
function renderPeriods(){const c=C(),h=$("#periods");h.innerHTML="";$("#more").hidden=!c;if(!c){h.innerHTML='<p class="hint">「＋ 新しい契約」からお客様を登録してください。</p>';return}
$("#pTitle").textContent=c.plan==="annual"?"請求する期間（年払い）":"請求する月（月払い）";if(c.plan==="annual"){const n=document.createElement("p");n.className="hint";n.style.margin="0 0 8px";n.textContent="年払いは1年分をまとめて請求します。各月（グレー）は個別には選べません。";h.appendChild(n)}
periodKeys(c).forEach(k=>{const p=info(c,k),[st,col]=status(c.ledger[k]);const b=document.createElement("button");b.type="button";b.setAttribute("aria-pressed",S.period===k?"true":"false");if(S.period===k){b.style.borderColor="var(--gold)";b.style.boxShadow="0 0 0 2px rgba(232,163,61,.4)"}
b.innerHTML=`<span>${esc(p.label)}<br><small>No.${esc(p.no)}　${yen(p.amount)}</small></span><span style="color:${col};font-weight:700;font-size:13px;align-self:center">${st}</span>`;if(p.annual){h.appendChild(b);const g=document.createElement("div");g.style.cssText="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:0 0 8px";for(let i=0;i<12;i++){const mb=document.createElement("button");mb.type="button";mb.disabled=true;mb.style.cssText="min-height:32px;padding:4px;font-size:12px;opacity:.45";mb.textContent=ymL(madd(p.from,i)).replace(/^\d+年/,"");mb.title="年払いに含まれるため個別には請求できません";g.appendChild(mb)}h.appendChild(g);const pick=()=>{if(S.period===k)return;S.period=k;renderPeriods();renderLedger();$("#pCard").scrollIntoView({behavior:"smooth",block:"start"})};b.onclick=pick;return}const pick=()=>{if(S.period===k)return;S.period=k;renderPeriods();renderLedger();$("#pCard").scrollIntoView({behavior:"smooth",block:"start"})};b.onclick=pick;h.appendChild(b)})}
function renderLedger(){const c=C();const ok=!!(c&&S.period);$("#selLabel").textContent=ok?info(c,S.period).label:"期間を選んでください";document.querySelectorAll("[data-l]").forEach(el=>{el.disabled=!ok;el.value=ok?(L(c,S.period)[el.dataset.l]||""):""});render()}
function changed(totals){const c=C();if(!c)return;if(totals)renderTotals();queue(c.id);renderPeriods();render();const o=[...$("#cSel").options].find(o=>o.value===c.id);if(o)o.textContent=`${c.code} ${c.client||"（お客様名未入力）"}`}
document.querySelectorAll("[data-i]").forEach(el=>el.oninput=()=>{S.issuer[el.dataset.i]=el.value;queue("issuer");render()});
document.querySelectorAll("[data-c]").forEach(el=>el.oninput=el.onchange=()=>{const c=C();if(!c)return;const k=el.dataset.c;if(String(c[k]??"")===el.value)return;c[k]=el.value;if(k==="plan"||k==="start"){S.period=null;renderLedger()}if(k==="due"){Object.values(c.ledger).forEach(l=>{if(!l.issued)delete l.dueDate})}changed(true)});
document.querySelectorAll("[data-l]").forEach(el=>el.oninput=el.onchange=()=>{const c=C();if(!c||!S.period)return;const l=L(c,S.period);if(String(l[el.dataset.l]??"")===el.value)return;l[el.dataset.l]=el.value;queue(c.id);renderPeriods();render()});
document.querySelectorAll("input[name=plan]").forEach(r=>r.addEventListener("change",()=>{const c=C();if(!c||!r.checked)return;const v=r.value==="annual"?"annual":"monthly";if(c.plan===v)return;c.plan=v;S.period=null;renderLedger();changed(true);say(v==="annual"?"年払いに切り替えました。下の一覧から年の期間を選んでください。":"月払いに切り替えました。下の一覧から月を選んでください。")}));
$("#cSel").onchange=e=>{S.cid=e.target.value;S.period=null;renderContracts()};
$("#cNew").onclick=()=>{const c=newContract();S.contracts.push(c);S.cid=c.id;S.period=null;renderContracts();queue(c.id);$("#cName").focus();say("新しい契約を作りました。お客様名と開始月を入力してください。")};
$("#addM").onclick=()=>{const c=C();if(!c)return;c.items.push({name:"",price:0});renderItems();changed(true)};
$("#more").onclick=()=>{const c=C();if(!c)return;c.show+=12;queue(c.id);renderPeriods()};
$("#cDel").onclick=async()=>{const c=C();if(!c)return;if(!confirm(`「${c.client||"この契約"}」を削除しますか？請求・入金の記録も消えます。`))return;S.contracts=S.contracts.filter(x=>x.id!==c.id);S.cid=S.contracts[0]?.id||null;S.period=null;renderContracts();try{if(db)await db.doc(`data/users/${uid}/profile`).collection("contracts").doc(c.id).delete();else persistLocal()}catch(e){say("削除の保存に失敗しました。",true)}};
document.querySelectorAll("[data-doc]").forEach(b=>b.onclick=()=>{current=b.dataset.doc;document.querySelectorAll("[data-doc]").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));render()});
let sayT;const say=(t,err)=>{const m=$("#msg");m.textContent=t;m.className="msg"+(err?" err":"");clearTimeout(sayT);if(t&&!err&&!t.endsWith("…"))sayT=setTimeout(()=>{m.textContent=""},5000)};
window.addEventListener("error",e=>say("【エラー】"+(e.message||"不明なエラー")+(e.lineno?"（"+e.lineno+"行目）":""),true));window.addEventListener("unhandledrejection",e=>say("【エラー】"+((e.reason&&(e.reason.message||e.reason.code))||String(e.reason)),true));$("#msg").onclick=()=>{$("#msg").textContent=""};
/* ===== storage ===== */
let db=null,uid=null,downloads=null;const timers={};
function persistLocal(){try{localStorage.setItem("tomoHoshuM",JSON.stringify({issuer:S.issuer,contracts:S.contracts}))}catch(e){}}
function queue(id){clearTimeout(timers[id]);timers[id]=setTimeout(async()=>{try{if(db){if(id==="issuer")await db.doc(`data/users/${uid}/profile`).set({issuer:S.issuer});else{const c=S.contracts.find(x=>x.id===id);if(c)await db.doc(`data/users/${uid}/profile`).collection("contracts").doc(id).set(JSON.parse(JSON.stringify(c)))}}else persistLocal()}catch(e){say("自動保存に失敗しました。通信状況を確認してください。",true)}},1000)}
async function init(){try{if(window.claude&&claude.use){db=await claude.use("db");const user=await claude.use("user");uid=user?await user.id():null;if(!uid)db=null}}catch(e){db=null}
try{if(db){const p=await db.doc(`data/users/${uid}/profile`).get();if(p.exists&&p.data().issuer)S.issuer={...defaultIssuer(),...JSON.parse(JSON.stringify(p.data().issuer))};const cs=await db.doc(`data/users/${uid}/profile`).collection("contracts").get();S.contracts=cs.docs.map(d=>JSON.parse(JSON.stringify(d.data())))}else{const v=JSON.parse(localStorage.getItem("tomoHoshuM")||"null");if(v){S.issuer={...defaultIssuer(),...v.issuer};S.contracts=v.contracts||[]}}}catch(e){say("保存データの読み込みに失敗しました。",true)}
S.contracts.forEach(c=>{c.plan="monthly"});S.contracts.sort((a,b)=>String(a.code).localeCompare(String(b.code)));S.cid=S.contracts[0]?.id||null;fillIssuer();renderContracts()}
function fillIssuer(){document.querySelectorAll("[data-i]").forEach(el=>el.value=S.issuer[el.dataset.i]||"")}
/* ===== PDF ===== */
async function snap(kind){const off=$("#off");off.innerHTML=docHTML(kind);let cv;try{cv=await html2canvas(off.firstElementChild,{scale:1.6,backgroundColor:"#ffffff",logging:false})}catch(e){cv=await html2canvas(off.firstElementChild,{scale:1,backgroundColor:"#ffffff",logging:false})}
const url=cv.toDataURL("image/jpeg",0.9);cv.width=0;cv.height=0;off.innerHTML="";if(!url||url.length<1000)throw new Error("canvas");return url}
async function makePdf(kinds){const {jsPDF}=window.jspdf||{};if(!jsPDF||!window.html2canvas)throw new Error("lib");await document.fonts.ready;const pdf=new jsPDF({unit:"mm",format:"a4"});const off=$("#off");
for(let i=0;i<kinds.length;i++){const url=await snap(kinds[i]);if(i)pdf.addPage();pdf.addImage(url,"JPEG",0,0,210,297)}return pdf.output("blob")}
async function exportPdf(kinds){const c=C();if(!c){say("先に「＋ 新しい契約」でお客様を登録してください。",true);return}if(!S.period){say("先に「請求する期間」から月（年）をタップして選んでください。",true);$("#periods").scrollIntoView({behavior:"smooth",block:"center"});return}const l=L(c,S.period),p=info(c,S.period);
if(kinds.includes("rec")&&!l.paid){say("領収書には入金日が必要です。先に「入金日（領収日）」を入力してください。",true);$("#dPaid").focus();return}
if(!downloads){await showImages(kinds);if(kinds.includes("inv")&&!l.issued){l.issued=today();queue(c.id);renderPeriods()}return}
const btns=[$("#pdfOne"),$("#pdfAll")];btns.forEach(b=>b.disabled=true);say("PDFを作成しています…");
try{const blob=await makePdf(kinds);const nm=c.client?`_${c.client}`:"";const base=kinds.length>1?"請求書・領収書":kinds[0]==="inv"?"請求書":"領収書";
await downloads.save({filename:`${base}${nm}_${p.label}.pdf`.replace(/[\\/:*?"<>|]/g,""),data:blob});if(kinds.includes("inv")&&!l.issued)l.issued=today();queue(c.id);renderPeriods();say("PDFを保存しました。")}
catch(e){const code=e&&e.code;if(code==="declined")say("保存をキャンセルしました。");else if(code==="rate_limited")say("少し待ってからもう一度お試しください。",true);else if(e&&e.message==="lib")say("PDF作成の準備ができていません。再読み込みしてください。",true);else{$("#off").innerHTML="";say("PDFの保存ができなかったため画像で表示します（"+((e&&(e.message||e.code))||e)+"）",true);await showImages(kinds)}}
finally{btns.forEach(b=>b.disabled=false)}}
async function showImages(kinds){if(!window.html2canvas){say("画像の作成に必要な部品を読み込めませんでした。再読み込みしてください。",true);return}say("画像を作成しています…");const box=$("#imgs");box.querySelectorAll("img").forEach(i=>{i.src=""});box.innerHTML="";
try{await document.fonts.ready;for(const k of kinds){const im=document.createElement("img");im.src=await snap(k);im.alt=k==="inv"?"請求書":"領収書";box.appendChild(im)}$("#imgModal").hidden=false;say("画像を長押しすると、写真への保存や共有ができます。")}
catch(e){$("#off").innerHTML="";say("書類の画像を作れませんでした（"+((e&&(e.message||e.code))||e)+"）",true)}}
$("#imgClose").onclick=()=>{$("#imgModal").hidden=true;$("#imgs").querySelectorAll("img").forEach(i=>{i.src=""});$("#imgs").innerHTML=""};
$("#pdfOne").onclick=()=>exportPdf([current]);$("#pdfAll").onclick=()=>exportPdf(["inv","rec"]);
fillIssuer();renderContracts();
(async()=>{try{if(window.claude&&claude.use)downloads=await claude.use("downloads")}catch(e){downloads=null}})();
const wrap=document.querySelector(".wrap");wrap.inert=true;wrap.style.opacity=".5";say("保存データを読み込んでいます…");
init().finally(()=>{wrap.inert=false;wrap.style.opacity="";if($("#msg").textContent.startsWith("保存データを"))say("")});
})();
</script>
</body>
</html>
